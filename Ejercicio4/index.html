<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galería Adaptable con Flexbox</title>
  <link rel="stylesheet" href="Style.css">
</head>
<body>

  <main class="contenedor-principal">
    <!-- Encabezado / Título de la sección -->
    <header class="encabezado-ejercicio">
      <h1>Galería de Imágenes Responsive</h1>
    </header>

    <!-- Sección de contenido: descripción + galería -->
    <section class="contenido-flex">
      
      <!-- Lado izquierdo: Instrucción o descripción -->
      <article class="descripcion">
        <h2>Descripción del ejercicio</h2>
        <p>Diseña e implementa una galería de fotos adaptable que organice sus elementos automáticamente según la pantalla disponible mediante <strong>Flexbox</strong>.</p>
      </article>

      <!-- Lado derecho: Cuadrícula/Galería de imágenes con Flexbox -->
      <div class="galeria-grid">
        <div class="tarjeta-imagen">
          <img src="https://via.placeholder.com/400x400.png?text=Aprende+Flexbox" alt="Imagen 1 de la galería">
        </div>
        <div class="tarjeta-imagen">
          <img src="https://via.placeholder.com/400x400.png?text=Aprende+Flexbox" alt="Imagen 2 de la galería">
        </div>
        <div class="tarjeta-imagen">
          <img src="https://via.placeholder.com/400x400.png?text=Aprende+Flexbox" alt="Imagen 3 de la galería">
        </div>
        <div class="tarjeta-imagen">
          <img src="https://via.placeholder.com/400x400.png?text=Aprende+Flexbox" alt="Imagen 4 de la galería">
        </div>
        <div class="tarjeta-imagen">
          <img src="https://via.placeholder.com/400x400.png?text=Aprende+Flexbox" alt="Imagen 5 de la galería">
        </div>
        <div class="tarjeta-imagen">
          <img src="https://via.placeholder.com/400x400.png?text=Aprende+Flexbox" alt="Imagen 6 de la galería">
        </div>
      </div>

    </section>
  </main>

</body>
</html>
