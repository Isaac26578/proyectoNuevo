<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layout de 3 Columnas con Flexbox</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Encabezado principal -->
  <header class="site-header">
    <h1>Bienvenido al Header</h1>
  </header>

  <!-- Contenedor principal que agrupa las 3 columnas -->
  <main class="site-main">
    <!-- Columna de navegación -->
    <nav class="site-nav">
      <h3>Navegación</h3>
      <ul>
        <li><a href="#">Inicio</a></li>
        <li><a href="#">Servicios</a></li>
        <li><a href="#">Contacto</a></li>
      </ul>
    </nav>

    <!-- Columna central (Artículo - Doble de ancho) -->
    <article class="site-article">
      <h2>Título del post</h2>
      <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Integer nec odio. Praesent libero. Sed cursus ante dapibus diam.</p>
    </article>

    <!-- Columna lateral (Aside) -->
    <aside class="site-aside">
      <h3>Columnas</h3>
      <p>Información complementaria o widgets adicionales de la página.</p>
    </aside>
  </main>

  <!-- Pie de página -->
  <footer class="site-footer">
    <p>Footer</p>
  </footer>

</body>
</html>
